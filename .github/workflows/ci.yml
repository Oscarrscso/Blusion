name: CI

# The macOS job runs scripts/verify.sh milestone: package tests, the mock addon, xcodegen, xcodebuild on a simulator and SwiftLint.
# Blusion ships on iOS only, so there is no Linux job.
on:
  # Pushes to main only: a push to a branch with an open PR would otherwise run CI twice (push + pull_request) and email twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per PR (or per ref without a PR). Superseded PR runs are cancelled; pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  macos:
    name: Full layer (macOS, Xcode, simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes
          node --version
      - name: Install tools
        run: brew install xcodegen swiftlint ffmpeg xcbeautify
      - name: verify.sh milestone
        run: ./scripts/verify.sh milestone
        env:
          SHOT: ci-launch
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-verify
          path: |
            shots/
            build/xcodebuild.log
            build/verify.xcresult
            .mock-addon.log
          if-no-files-found: ignore
          retention-days: 14

  # Informational: the opt-in fallback engine (ADR-006, MPVKit). It cannot fail the build; it tells you whether the unverified
  # MPVKit pin and MPVBackend glue work. Fix Packages/FallbackPlayer first if this job is red.
  # Manual only (workflow_dispatch). It never runs on push or PR, so it cannot add red runs or emails to those.
  macos-fallback:
    name: Opt-in fallback engine (informational)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install tools
        run: brew install xcodegen swiftlint ffmpeg xcbeautify
      - name: verify.sh milestone with the fallback engine
        run: FALLBACK=1 ./scripts/verify.sh milestone
      - name: Binary size delta
        if: always()
        run: ./scripts/size-report.sh
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-fallback
          path: |
            shots/
            build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
