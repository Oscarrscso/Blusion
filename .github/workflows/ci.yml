name: CI

# ADR-002: the Linux job proves the host layer (packages + mock addon); the macOS job runs the Xcode steps of
# scripts/verify.sh (xcodegen, xcodebuild on a simulator, SwiftLint). Both must be green for a milestone.
on:
  # Pushes to main only: a push to a branch with an open PR would otherwise run CI twice (push + pull_request) and email twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per PR (or per ref without a PR). Superseded PR runs are cancelled; pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  host-linux:
    name: Host layer (Linux, Swift 6.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install host tools and Swift dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl python3 python3-yaml ca-certificates \
            binutils gnupg2 libc6-dev libcurl4-openssl-dev libedit2 libgcc-13-dev libncurses-dev \
            libpython3-dev libsqlite3-0 libstdc++-13-dev libxml2-dev libz3-dev pkg-config zlib1g-dev
          node --version
      - name: Install Swift 6.3.3
        # Swiftly downloads and verifies the toolchain from swift.org, avoiding Docker Hub's anonymous pull limit.
        run: |
          curl -fL --retry 3 https://download.swift.org/swiftly/linux/swiftly-1.1.2-x86_64.tar.gz -o "$RUNNER_TEMP/swiftly.tar.gz"
          tar -xzf "$RUNNER_TEMP/swiftly.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/swiftly" init --assume-yes --skip-install --no-modify-profile --quiet-shell-followup
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install 6.3.3 --assume-yes
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"
          swift --version
      - name: verify.sh (host layer)
        run: ./scripts/verify.sh
      - name: Coverage gate (StremioKit)
        run: ./scripts/coverage.sh StremioKit 90

  macos:
    name: Full layer (macOS, Xcode, simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes
          node --version
      - name: Install tools
        run: brew install xcodegen swiftlint ffmpeg xcbeautify
      - name: verify.sh milestone
        run: ./scripts/verify.sh milestone
        env:
          SHOT: ci-launch
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-verify
          path: |
            shots/
            build/xcodebuild.log
            build/verify.xcresult
            .mock-addon.log
          if-no-files-found: ignore
          retention-days: 14

  # Informational: the opt-in fallback engine (ADR-006, MPVKit). It cannot fail the build; it tells you whether the unverified
  # MPVKit pin and MPVBackend glue work. Fix Packages/FallbackPlayer first if this job is red.
  # Manual only (workflow_dispatch). It never runs on push or PR, so it cannot add red runs or emails to those.
  macos-fallback:
    name: Opt-in fallback engine (informational)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install tools
        run: brew install xcodegen swiftlint ffmpeg xcbeautify
      - name: verify.sh milestone with the fallback engine
        run: FALLBACK=1 ./scripts/verify.sh milestone
      - name: Binary size delta
        if: always()
        run: ./scripts/size-report.sh
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-fallback
          path: |
            shots/
            build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
