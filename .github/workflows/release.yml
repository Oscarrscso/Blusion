name: Publish alpha release
on:
  schedule:
    # After the 02:23 UTC public sync, so main has the newest source.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build even when main has no new commit since the last release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: publish-alpha-release
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'Oscarrscso/Blusion' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      build: ${{ steps.pick.outputs.build }}
      create: ${{ steps.pick.outputs.create }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether this commit needs a release
        id: pick
        env:
          # Boolean inputs exist only on workflow_dispatch. A schedule run leaves this false.
          REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          readme = Path("README.md").read_text()
          found = re.search(r" Blusion (v\.[0-9]+a) </h1>", readme)
          if not found:
              raise SystemExit("README is missing the v.<count>a version")
          version = found.group(1)
          head = git("rev-parse", "HEAD")

          # A tag on this commit means it is already released. Do not use HEAD^:
          # that would treat the released commit itself as a new commit.
          previous = subprocess.run(
              ["git", "describe", "--tags", "--match", "v.*", "--abbrev=0", "HEAD"],
              capture_output=True, text=True,
          )
          if previous.returncode != 0:
              changed = True
              print("No previous v.* release")
          else:
              baseline = previous.stdout.strip()
              baseline_commit = git("rev-parse", f"{baseline}^{{commit}}")
              changed = baseline_commit != head
              if changed:
                  print(f"New commits since {baseline}")
              else:
                  print(f"No new commit since {baseline}")

          existing = subprocess.run(
              ["git", "rev-parse", "-q", "--verify", f"refs/tags/{version}^{{commit}}"],
              capture_output=True, text=True,
          )
          create = True
          if existing.returncode == 0:
              tagged = existing.stdout.strip()
              if tagged != head:
                  raise SystemExit(f"Tag {version} already exists on {tagged}; refusing to move it")
              create = False
              print(f"{version} already points at this commit")

          rebuild = os.environ.get("REBUILD") == "true"
          build = changed or rebuild
          if not build:
              create = False
              print("Skipping the IPA build")
          elif not changed:
              print("Rebuilding because dispatch passed rebuild: true")

          print(f"version={version} build={str(build).lower()} create={str(create).lower()}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={version}\n")
              output.write(f"build={'true' if build else 'false'}\n")
              output.write(f"create={'true' if create else 'false'}\n")
          PY
  build:
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The tag is created after this build, so check out the commit being released.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          selected=""
          if [[ -d /Applications/Xcode.app ]]; then
            version="$(/Applications/Xcode.app/Contents/Developer/usr/bin/xcodebuild -version 2>/dev/null | head -n 1 || true)"
            case "$version" in
              "Xcode 26"*) selected="/Applications/Xcode.app" ;;
            esac
          fi
          if [[ -z "$selected" ]]; then
            shopt -s nullglob
            candidates=(/Applications/Xcode_26*.app)
            shopt -u nullglob
            if [[ ${#candidates[@]} -gt 0 ]]; then
              # GNU sort -V. macOS /usr/bin/sort has no -V, so fall back to the same ordering.
              if printf '' | sort -V >/dev/null 2>&1; then
                selected="$(printf '%s\n' "${candidates[@]}" | sort -V | tail -n 1)"
              else
                selected="$(printf '%s\n' "${candidates[@]}" | python3 -c 'import re,sys; rows=[line for line in sys.stdin.read().splitlines() if line]; key=lambda path: [int(part) if part.isdigit() else part for part in re.split(r"(\d+)", path)]; print(sorted(rows, key=key)[-1])')"
              fi
            fi
          fi
          [[ -n "$selected" && -d "$selected" ]] || { echo "Xcode 26 is not installed"; exit 1; }
          sudo xcode-select -s "$selected/Contents/Developer"
          xcodebuild -version | head -n 1 | grep -q '^Xcode 26' || { xcodebuild -version; echo "Xcode 26 is required"; exit 1; }
          echo "Selected ${selected}"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned IPA
        env:
          BLUSION_RELEASE_TAG: ${{ needs.select.outputs.tag }}
        run: bash scripts/build-unsigned-ipa.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Blusion.ipa
          path: build/Blusion.ipa
          if-no-files-found: error
          compression-level: 0
  upload:
    needs: [select, build]
    if: needs.select.outputs.build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Blusion.ipa
          path: dist
      - name: Publish the release
        if: needs.select.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.select.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          readme = Path("README.md").read_text()
          found = re.search(r" Blusion (v\.[0-9]+a) </h1>", readme)
          if not found:
              raise SystemExit("README is missing the v.<count>a version")
          version = found.group(1)
          if version != os.environ["VERSION"]:
              raise SystemExit(f"README version {version} does not match the selected tag {os.environ['VERSION']}")
          previous = subprocess.run(["git", "describe", "--tags", "--match", "v.*", "--abbrev=0", "HEAD^"], capture_output=True, text=True)
          baseline = previous.stdout.strip() if previous.returncode == 0 else git("hash-object", "-t", "tree", "/dev/null")
          changes = git("diff", "--name-only", baseline, "HEAD").splitlines()
          groups = Counter()
          for path in changes:
              parts = path.split("/")
              if path.startswith("Packages/Features/Sources/") and len(parts) > 3:
                  group = "App interface" if parts[3] == "Views" else parts[3]
              elif path.startswith("Packages/"):
                  group = {"StremioKit": "Metadata and addons", "PlayerKit": "Playback", "AetherPlayer": "Playback", "FallbackPlayer": "Playback", "PlaybackGeometry": "Playback", "Persistence": "Saved data"}.get(parts[1], parts[1])
              else:
                  group = {"App": "App startup and assets", "scripts": "Build tools", "Config": "Build configuration", "project.yml": "Build configuration", ".github": "Release automation", "docs": "Documentation", "README.md": "Documentation"}.get(parts[0], "Repository maintenance")
              groups[group] += 1
          notes = [f"Alpha source release **{version}**. The number is the app source commit count at sync time.", "", "### Changes"]
          notes += [f"- {group}: {count} file{'s' if count != 1 else ''} updated." for group, count in sorted(groups.items())]
          if previous.returncode == 0:
              notes += ["", f"[Full changes](https://github.com/{os.environ['GITHUB_REPOSITORY']}/compare/{baseline}...{version})"]
          notes += [
              "",
              "### Install",
              "",
              "The nightly build attaches an unsigned iPhone app, `Blusion.ipa`. It is not signed with an Apple Developer certificate. Install it with AltStore, SideStore or Sideloadly, which sign it using your Apple ID.",
              "",
              "To build from source, see the [build instructions](https://github.com/Oscarrscso/Blusion#build).",
          ]
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text("\n".join(notes) + "\n")
          PY
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; leaving its tag, title and notes unchanged."
          else
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$VERSION" --latest \
              --notes-file "$RUNNER_TEMP/release-notes.md"
            test "$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isPrerelease,isDraft --jq '(.isPrerelease or .isDraft)')" = "false"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${VERSION}" --jq .sha)" = "$GITHUB_SHA"
            latest=""
            for _ in 1 2 3 4 5; do
              latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
              [[ "$latest" == "$VERSION" ]] && break
              sleep 2
            done
            test "$latest" = "$VERSION"
          fi
      - name: Attach Blusion.ipa
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select.outputs.tag }}
        run: |
          set -euo pipefail
          ipa="$(find dist -name Blusion.ipa -type f -print -quit)"
          [[ -n "$ipa" ]] || { echo "Blusion.ipa was not downloaded"; exit 1; }
          # The long upload uses a temporary name, so Blusion.ipa stays available if it fails.
          tmp="Blusion.ipa.${GITHUB_RUN_ID}"
          cp "$ipa" "${RUNNER_TEMP}/${tmp}"
          gh release upload "$TAG" "${RUNNER_TEMP}/${tmp}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG" "$ipa" --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'Blusion.ipa'
          gh release delete-asset "$TAG" "$tmp" --repo "$GITHUB_REPOSITORY" --yes
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets \
            --jq '{tag: .tagName, ipa: [.assets[] | select(.name == "Blusion.ipa") | {name, size}]}'
