name: Blusion

# Source of truth for the Xcode project. Never hand-edit or commit *.xcodeproj. Generate it with scripts/generate-project.sh, which
# uses XcodeGen without private credential injection.
# Bundle ID is generic. Keep the signing team out of this file (Config/Signing.xcconfig.local or BLUSION_DEVELOPMENT_TEAM).
options:
  bundleIdPrefix: app.blusion
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set by scripts/install-iphone.sh to the git commit it builds, so Settings › About shows which build is running.
    BLUSION_BUILD_TAG: dev
    BLUSION_SOURCE_REVISION: unversioned
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # MPVKit ships flat Catalyst frameworks. The post-embed step must restructure and re-sign their nested files.
    "ENABLE_USER_SCRIPT_SANDBOXING[sdk=macosx*]": NO
    CODE_SIGN_STYLE: Automatic

# The signing team comes from Config/Signing.xcconfig, which includes the Git-ignored Config/Signing.xcconfig.local when it exists,
# so a regenerated project keeps the local team. No identity is tracked here.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  StremioKit:
    path: Packages/StremioKit
  PlayerKit:
    path: Packages/PlayerKit
  Persistence:
    path: Packages/Persistence
  Features:
    path: Packages/Features
  FallbackPlayer:
    path: Packages/FallbackPlayer
  AetherPlayer:
    path: Packages/AetherPlayer

targets:
  Blusion:
    type: application
    platform: iOS
    sources:
      - path: App
    postBuildScripts:
      - name: Record commit count
        script: |
          set -eu
          COUNT=$(/usr/bin/git -C "$SRCROOT" rev-list --count HEAD)
          /usr/libexec/PlistBuddy -c "Set :BlusionCommitCount $COUNT" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/.git
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
      - name: Normalize Catalyst framework bundles
        script: |
          if [ "$EFFECTIVE_PLATFORM_NAME" = "-maccatalyst" ]; then
            /usr/bin/python3 "$BLUSION_REPO_ROOT/scripts/normalize-catalyst-frameworks.py"
          fi
        basedOnDependencyAnalysis: false
        # Xcode copies a package's frameworks in on its own schedule, not in phase order: listed as inputs, they are in place first.
        inputFileLists:
          - $(BLUSION_REPO_ROOT)/scripts/mpv-frameworks.xcfilelist
    dependencies:
      - package: StremioKit
      - package: PlayerKit
      - package: Persistence
      - package: Features
      - package: FallbackPlayer
      # AetherPlayer is dynamic, so the installed app must carry its framework as well as link it. On Mac Catalyst its libraries
      # link through the Catalyst slices scripts/aether-catalyst-slices.py makes from their macOS ones (arm64).
      - package: AetherPlayer
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Blusion
        BlusionCommitCount: "0"
        BlusionBuildTag: $(BLUSION_BUILD_TAG)
        BlusionSourceRevision: $(BLUSION_SOURCE_REVISION)
        # Always dark, from the first frame: the launch screen and system alerts follow this key, not SwiftUI's preferredColorScheme.
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: LaunchBackground
          # Centred on the whole screen at its own size; LaunchSplash draws it at the same place, so the handoff does not move.
          UIImageName: LaunchLogo
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.entertainment
        # Addons may live on the user's LAN over plain http. NSAllowsLocalNetworking exempts local addresses from ATS only.
        # NSAllowsArbitraryLoadsForMedia exempts only loads AVFoundation performs itself (many direct stream URLs are plain http).
        # NSAllowsArbitraryLoads is never set.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsForMedia: true
        # Background audio and Picture in Picture.
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: "Blusion connects to addons you install that run on your local network."
        # Player apps a stream can be handed to. Needed for canOpenURL to say whether one is installed.
        LSApplicationQueriesSchemes:
          - infuse
        # blusion://x-callback-url/...: how a player app reports where the viewer stopped (ExternalPlayerCallback).
        CFBundleURLTypes:
          - CFBundleURLName: app.blusion.player.callback
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - blusion
          # stremio://host/.../manifest.json: the Install link on an addon's own page. Opens Blusion on the install screen.
          - CFBundleURLName: app.blusion.player.addon-install
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - stremio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blusion.player
        # Commit-count versioning reads Git history at build time.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The Mac app is this same target built with Mac Catalyst in the Mac idiom (6): real Mac controls and a sidebar.
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        TARGETED_DEVICE_FAMILY: "1,2,6"
        # No developer account is bundled. DEVELOPMENT_TEAM comes from Config/Signing.xcconfig or the xcodebuild command line.
        # Never set it here, not even to "": a target setting overrides the config file and drops the local team.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        # The repository root, for build scripts. A project generated elsewhere (build/*/) overrides it, as its SRCROOT is that folder.
        BLUSION_REPO_ROOT: "$(SRCROOT)"


schemes:
  Blusion:
    build:
      targets:
        Blusion: all
      preActions:
        - name: Apply Aether Swift 6 compatibility fix and its Mac Catalyst slices
          settingsTarget: Blusion
          script: 'bash "$BLUSION_REPO_ROOT/scripts/prepare-aether.sh" "$BUILD_DIR"; if [ "$PLATFORM_NAME" = macosx ]; then /usr/bin/python3 "$BLUSION_REPO_ROOT/scripts/aether-catalyst-slices.py" "$BUILD_DIR"; fi'
    run:
      config: Debug
      # Run without LLDB attached: on Xcode 26 / iOS 26 the debugger attach leaves the app on a dark screen for a long time at launch.
      debugEnabled: false
