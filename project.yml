name: Blusion

# Source of truth for the Xcode project. Never hand-edit or commit *.xcodeproj (PLAN §1).
# Lines starting with `#fallback# ` are the opt-in fallback engine (ADR-006). scripts/enable-fallback.sh strips that marker into
# project.fallback.generated.yml; the default build never sees the third-party player.
# Bundle id and signing team are placeholders for the human to change before release (docs/RELEASE.md).
options:
  bundleIdPrefix: app.blusion
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    # String Catalogs (App/Localizable.xcstrings, App/InfoPlist.xcstrings); seed with scripts/extract-strings.py.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  StremioKit:
    path: Packages/StremioKit
  PlayerKit:
    path: Packages/PlayerKit
  Persistence:
    path: Packages/Persistence
  Features:
    path: Packages/Features
  #fallback# FallbackPlayer:
  #fallback#   path: Packages/FallbackPlayer

targets:
  Blusion:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: StremioKit
      - package: PlayerKit
      - package: Persistence
      - package: Features
      #fallback# - package: FallbackPlayer
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Blusion
        # Always dark, from the first frame: the launch screen and system alerts follow this key, not SwiftUI's preferredColorScheme.
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.entertainment
        # Addons may live on the user's LAN over plain http. NSAllowsLocalNetworking exempts local addresses from ATS only.
        # NSAllowsArbitraryLoadsForMedia exempts only loads AVFoundation performs itself (many direct stream URLs are plain http); ADR-005.
        # NSAllowsArbitraryLoads is never set (PLAN §1).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsForMedia: true
        # Background audio and Picture in Picture (ADR-005).
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: "Blusion connects to addons you install that run on your local network."
        # Player apps a stream can be handed to. Needed for canOpenURL to say whether one is installed.
        LSApplicationQueriesSchemes:
          - infuse
        # blusion://x-callback-url/...: how a player app reports where the viewer stopped (ExternalPlayerCallback).
        CFBundleURLTypes:
          - CFBundleURLName: app.blusion.player.callback
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - blusion
          # stremio://host/.../manifest.json: the Install link on an addon's own page. Opens Blusion on the install screen.
          - CFBundleURLName: app.blusion.player.addon-install
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - stremio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blusion.player
        # The Mac app is this same target built with Mac Catalyst in the Mac idiom (6): real Mac controls and a sidebar.
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        TARGETED_DEVICE_FAMILY: "1,2,6"
        # The owner's signing team. Kept here because the project is regenerated from this file; a team picked in Xcode would be lost.
        DEVELOPMENT_TEAM: 4DAM5V8UD3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        #fallback# OTHER_SWIFT_FLAGS: "$(inherited) -DBLUSION_FALLBACK_ENGINE"

  BlusionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/BlusionTests
    dependencies:
      - target: Blusion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blusion.player.tests
        GENERATE_INFOPLIST_FILE: YES

  BlusionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/BlusionUITests
    dependencies:
      - target: Blusion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blusion.player.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Blusion

schemes:
  Blusion:
    build:
      targets:
        Blusion: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BlusionTests
        - BlusionUITests
