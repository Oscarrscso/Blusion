name: Blusion

# Source of truth for the Xcode project. Never hand-edit or commit *.xcodeproj (PLAN §1).
# Bundle id and signing team are placeholders for the human to change before release (docs/RELEASE.md).
options:
  bundleIdPrefix: app.blusion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

packages:
  StremioKit:
    path: Packages/StremioKit
  PlayerKit:
    path: Packages/PlayerKit
  Persistence:
    path: Packages/Persistence
  Features:
    path: Packages/Features

targets:
  Blusion:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: StremioKit
      - package: PlayerKit
      - package: Persistence
      - package: Features
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Blusion
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Addons may live on the user's LAN over plain http. NSAllowsLocalNetworking exempts local addresses from ATS only.
        # NSAllowsArbitraryLoadsForMedia exempts only loads AVFoundation performs itself (many direct stream URLs are plain http); ADR-005.
        # NSAllowsArbitraryLoads is never set (PLAN §1).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsForMedia: true
        # Background audio and Picture in Picture (ADR-005).
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: "Blusion connects to addons you install that run on your local network."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blusion.player
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  BlusionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/BlusionTests
    dependencies:
      - target: Blusion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blusion.player.tests
        GENERATE_INFOPLIST_FILE: YES

  BlusionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/BlusionUITests
    dependencies:
      - target: Blusion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blusion.player.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Blusion

schemes:
  Blusion:
    build:
      targets:
        Blusion: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BlusionTests
        - BlusionUITests
